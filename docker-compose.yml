name: farmared

services:
  mongo:
    image: mongo:8.0.16
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:?Definir MONGODB_USER en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:?Definir MONGODB_PASSWORD en .env}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin
          --eval 'if (db.adminCommand({ping: 1}).ok !== 1) quit(1)'
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  neo4j:
    image: neo4j:5.26.0-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Definir NEO4J_PASSWORD en .env}
      FARMARED_NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Definir NEO4J_PASSWORD en .env}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cypher-shell -a bolt://localhost:7687 -u neo4j
          -p "$$FARMARED_NEO4J_PASSWORD" 'RETURN 1 AS ready;' > /dev/null
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

volumes:
  mongo-data:
  neo4j-data:

# Fixture de migración: mismo motor y volumen, sin replica set ni puertos públicos.
services:
  mongo:
    image: mongo:8.0.16
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:?}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:?}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --nodb --quiet --eval
          'const a = new Mongo("mongodb://localhost:27017/admin?directConnection=true").getDB("admin");
          if (!a.auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD).ok) quit(1);
          if (a.runCommand({ping:1}).ok !== 1) quit(1);'
      interval: 5s
      timeout: 10s
      retries: 30
volumes:
  mongo-data:

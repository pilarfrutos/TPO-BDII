# Override del Compose raíz; ejecutar con scripts/test_t03.sh, no por separado.
# !reset elimina los puertos heredados para aislar las pruebas.
services:
  mongo:
    ports: !reset []
  neo4j:
    ports: !reset []
  validator:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      target: validation
    environment:
      MONGODB_URI: mongodb://mongo:27017/?authSource=admin&directConnection=true&replicaSet=rs0
      MONGODB_DATABASE: farmared_t03_test
      MONGODB_USER: ${MONGODB_USER:?}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD:?}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?}
      NEO4J_DATABASE: neo4j
